# AGP 8.7.3 + Gradle 8.10.2 需要 JDK 17+。系统默认 JAVA_HOME 指向 JDK 8 会导致编译
# 极慢甚至卡死。
#
# ⚠️ 下面这行是**本机专属绝对路径**（macOS / Apple Silicon，Homebrew openjdk@17，
# 版本 17.0.20.1，与 AGP 8.7.3 配套）。换机器、换 JDK 必须改这里。
# 完整说明（为什么不用通配符、换机怎么改）见 docs/LOCAL-BUILD.md。
# 原值 C:/Users/jjuugk/Desktop/CarPToCarL/.tools/jdk-17.0.20.1+1 是作者的 Windows 路径。
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
